# This is a REFERENCE file only — it is NOT inside .github/workflows/
# so it won't run automatically. This is what an AI tool suggests
# after you paste ci.yml to it and ask it to optimize the pipeline.
#
# Once you get your own AI-suggested version (which may differ
# slightly), replace .github/workflows/ci.yml with it and push again
# to compare build times.

name: CI (optimized)

on: [push]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'                     # <-- caches pip downloads

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run linter
        run: flake8 app.py test_app.py

  test:
    runs-on: ubuntu-latest
    needs: []                              # <-- runs in PARALLEL with lint, not after it
    strategy:
      matrix:
        python-version: ['3.10', '3.11']   # <-- tests against multiple versions at once
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -v
